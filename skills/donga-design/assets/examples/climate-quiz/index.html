<!doctype html>
<html lang="ko">
<!-- © 2026 김용현 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기후 그래프 읽기</title>
<style>
/* © 2026 김용현 */
/*
  동아 디자인 토큰 (당토 디자인 규격 + 동아출판 CI 색 고정)
  사용법
    1. 이 파일 내용을 index.html의 <style> 안에 그대로 붙인다. (CSS 파일을 따로 두지 않는다)
    2. 화면 전체를 <div class="dc-content">로 감싼다. 모든 규칙은 이 래퍼 안에서만 동작한다.
       태그 선택자, :root, *, !important를 쓰지 않는다. 새 규칙도 ".dc-content .클래스" 형태로만 쓴다.
    3. 색은 고정이다. 아래 "CI 색" 블록을 바꾸지 않는다. 다른 색이 필요하면 역할 색(--accent 등)을 쓴다.
    4. 다이얼: 래퍼나 그 안의 영역에 data-density="compact"(촘촘), data-personality="brand"(브랜드).
    5. 다크 모드: 시스템 설정을 따르고, 래퍼나 그 안의 영역에 data-theme="light|dark"로 강제할 수 있다.
  글꼴: 외부 CDN을 쓰지 않는다. assets/fonts/ 의 Pretendard를 아래 @font-face로 불러온다.
*/

@font-face { font-family: "Pretendard"; font-weight: 400; font-display: swap; src: url("../../fonts/Pretendard-Regular.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 500; font-display: swap; src: url("../../fonts/Pretendard-Medium.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 600; font-display: swap; src: url("../../fonts/Pretendard-SemiBold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("../../fonts/Pretendard-Bold.woff2") format("woff2"); }

.dc-content {
  /* ===== CI 색 (고정, 바꾸지 않는다) ===== */
  --donga-red: #ec1940;          /* CI 빨강. 로고와 브랜드 그래픽에만 */
  --donga-ink: #333333;          /* CI 먹. 로고 ㄷ과 글자표 */

  /* ===== 테마색 (CI에서 만든 값, 고정) ===== */
  --accent-light: #d4153a;       /* 주색, 라이트: CI 빨강을 OKLCH 밝기만 내림. 흰 글자 대비 5.3 */
  --on-accent-light: #ffffff;
  --accent-dark: #ff5a72;        /* 주색, 다크: 밝게 올림. 위 글자 대비 6.2 */
  --on-accent-dark: #2a0610;
  --second-base: #333333;        /* 보조색 = CI 먹: 머리 띠, 로고, 차트 둘째 계열. 버튼에 쓰지 않음 */

  /* ===== 회색 10단계 (남색 기운) ===== */
  --gray-50: #f8f9fb;
  --gray-100: #f1f3f6;
  --gray-200: #e4e7ec;
  --gray-300: #d0d5dd;
  --gray-400: #a9b1bd;
  --gray-500: #868f9c;
  --gray-600: #646d7a;
  --gray-700: #4a5260;
  --gray-800: #2f3640;
  --gray-900: #1a1e25;

  /* ===== 역할 색, 라이트 ===== */
  --bg: var(--gray-100);
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --fill-subtle: var(--gray-100);
  --text-strong: var(--gray-900);
  --text: var(--gray-700);
  --text-muted: var(--gray-600);
  --icon-muted: var(--gray-500);
  --text-disabled: var(--gray-400);
  --line: rgba(16, 24, 40, 0.08);
  --line-strong: rgba(16, 24, 40, 0.16);
  --focus: #2a64d4;
  --logo-ink: var(--donga-ink);

  /* 위험색은 주색(빨강)과 헷갈리지 않게 주황 쪽으로 옮긴 빨강. 늘 아이콘과 문구를 함께 쓴다 */
  --positive: #0b7a52;  --positive-weak: #e6f5ee;
  --warning:  #8a5a00;  --warning-weak:  #fdf3dc;
  --critical: #b42318;  --critical-weak: #fdeeea;
  --info:     #2a64d4;  --info-weak:     #eaf1fd;

  /* 자료 색: 지도, 차트, 범례 계열. 빨강 주색, 상태색과 따로. 버튼에 쓰지 않음 */
  --data-1: #2563c9; --data-2: #b4530a; --data-3: #0f7f86; --data-4: #6b7380;

  --accent: var(--accent-light);
  --on-accent: var(--on-accent-light);
  --second: var(--second-base);

  /* ===== 글자 (편안 기본) ===== */
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: var(--font);
  --fs-caption: 0.8125rem;  /* 13 */
  --fs-small: 0.875rem;     /* 14 */
  --fs-body: 1rem;          /* 16 */
  --fs-body-lg: 1.125rem;   /* 18: 학생 개인 기기 본문 권장 */
  --fs-title-s: 1.25rem;    /* 20 */
  --fs-title: 1.5rem;       /* 24 */
  --fs-title-l: 1.875rem;   /* 30 */
  --lh-body: 1.5;
  --lh-title: 1.35;
  --ls-title: -0.025em;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* ===== 크기 (편안) ===== */
  --row-h: 3.5rem;
  --btn-h: 3.25rem;
  --btn-h-s: 2.75rem;       /* 작은 버튼도 44 (두클래스 최소 터치 영역) */
  --touch: 2.75rem;         /* 44, 교실 화면은 --touch-class */
  --touch-class: 3rem;      /* 48 */
  --page-x: 1.25rem;

  /* ===== 간격 (4px 단위) ===== */
  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem;
  --sp-5: 1.25rem; --sp-6: 1.5rem; --sp-8: 2rem; --sp-10: 2.5rem; --sp-12: 3rem; --sp-16: 4rem;

  /* ===== 모서리 ===== */
  --r-badge: 4px;
  --r-control: 10px;
  --r-card: 16px;
  --r-sheet: 20px;
  --r-full: 999px;

  /* ===== 그림자 (떠 있는 것에만) ===== */
  --shadow-1: 0 1px 4px rgba(16, 24, 40, 0.06);
  --shadow-2: 0 4px 16px rgba(16, 24, 40, 0.08);
  --shadow-3: 0 12px 32px rgba(16, 24, 40, 0.12);

  /* ===== 겹침 순서 (100 이하) ===== */
  --z-sticky: 10;
  --z-sheet: 50;
  --z-toast: 60;

  /* ===== 움직임 ===== */
  --dur-fast: 150ms;
  --dur: 250ms;
  --dur-slow: 400ms;
  --ease: cubic-bezier(0.35, 0, 0.35, 1);
  --ease-enter: cubic-bezier(0, 0, 0.15, 1);
  --ease-exit: cubic-bezier(0.35, 0, 1, 1);

  color-scheme: light;
}

/* ===== 다크 모드 ===== */
@media (prefers-color-scheme: dark) {
  .dc-content:not([data-theme="light"]) {
    --bg: #121418;
    --surface: #1b1e24;
    --surface-raised: #252930;
    --fill-subtle: #252930;
    --text-strong: #eef0f3;
    --text: #c4cad3;
    --text-muted: #8e97a4;
    --icon-muted: #6b7380;
    --text-disabled: #5d6571;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --focus: #7aa5ff;
    --logo-ink: #eceef1;
    --positive: #3ccf8e;  --positive-weak: #15302a;
    --warning:  #f0b44a;  --warning-weak:  #33291a;
    --critical: #ff8a5c;  --critical-weak: #3a2219;
    --info:     #7aa5ff;  --info-weak:     #1d2840;
    --accent: var(--accent-dark);
    --on-accent: var(--on-accent-dark);
    --second: #e8e8e8;
    --data-1: #7aa5ff; --data-2: #ffa45c; --data-3: #4fc9cf; --data-4: #9aa3b0;
    --shadow-1: none; --shadow-2: none; --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
.dc-content[data-theme="dark"],
.dc-content [data-theme="dark"] {
  --bg: #121418;
  --surface: #1b1e24;
  --surface-raised: #252930;
  --fill-subtle: #252930;
  --text-strong: #eef0f3;
  --text: #c4cad3;
  --text-muted: #8e97a4;
  --icon-muted: #6b7380;
  --text-disabled: #5d6571;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --focus: #7aa5ff;
  --logo-ink: #eceef1;
  --positive: #3ccf8e;  --positive-weak: #15302a;
  --warning:  #f0b44a;  --warning-weak:  #33291a;
  --critical: #ff8a5c;  --critical-weak: #3a2219;
  --info:     #7aa5ff;  --info-weak:     #1d2840;
  --accent: var(--accent-dark);
  --on-accent: var(--on-accent-dark);
  --second: #e8e8e8;
  --data-1: #7aa5ff; --data-2: #ffa45c; --data-3: #4fc9cf; --data-4: #9aa3b0;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
/* 래퍼 안 일부만 라이트로 되돌릴 때 */
.dc-content [data-theme="light"] {
  --bg: var(--gray-100); --surface: #ffffff; --surface-raised: #ffffff; --fill-subtle: var(--gray-100);
  --text-strong: var(--gray-900); --text: var(--gray-700); --text-muted: var(--gray-600);
  --icon-muted: var(--gray-500); --text-disabled: var(--gray-400);
  --line: rgba(16, 24, 40, 0.08); --line-strong: rgba(16, 24, 40, 0.16); --focus: #2a64d4;
  --logo-ink: var(--donga-ink);
  --positive: #0b7a52; --positive-weak: #e6f5ee; --warning: #8a5a00; --warning-weak: #fdf3dc;
  --critical: #b42318; --critical-weak: #fdeeea; --info: #2a64d4; --info-weak: #eaf1fd;
  --accent: var(--accent-light); --on-accent: var(--on-accent-light); --second: var(--second-base);
  --data-1: #2563c9; --data-2: #b4530a; --data-3: #0f7f86; --data-4: #6b7380;
  color-scheme: light;
}

/* ===== 자동 계산 (건드리지 않음) ===== */
.dc-content, .dc-content [data-theme] {
  --accent-press: color-mix(in oklch, var(--accent) 86%, black);
  --accent-weak: color-mix(in oklch, var(--accent) 9%, var(--surface));
  --accent-weak-press: color-mix(in oklch, var(--accent) 16%, var(--surface));
  --accent-text: color-mix(in oklch, var(--accent) 90%, var(--text-strong));
}
@media (prefers-color-scheme: dark) {
  .dc-content:not([data-theme="light"]) { --accent-press: color-mix(in oklch, var(--accent) 85%, white); }
}
.dc-content[data-theme="dark"], .dc-content [data-theme="dark"] { --accent-press: color-mix(in oklch, var(--accent) 85%, white); }

/* ===== 다이얼: 촘촘 (교사, 관리 화면) ===== */
.dc-content[data-density="compact"], .dc-content [data-density="compact"] {
  --fs-caption: 0.75rem;
  --fs-small: 0.8125rem;
  --fs-body: 0.875rem;
  --fs-body-lg: 0.875rem;
  --fs-title-s: 1rem;
  --fs-title: 1.125rem;
  --fs-title-l: 1.375rem;
  --lh-body: 1.45;
  --fw-medium: 400;
  --fw-bold: 600;
  --row-h: 2.5rem;
  --btn-h: 2.75rem;         /* 두클래스 최소 44 를 지킨다 */
  --btn-h-s: 2.75rem;
  --page-x: 1rem;
  --r-control: 7px;
  --r-card: 10px;
  --r-sheet: 14px;
}

/* ===== 다이얼: 브랜드 ===== */
.dc-content[data-personality="brand"], .dc-content [data-personality="brand"] {
  --r-badge: 0; --r-control: 0; --r-card: 0; --r-sheet: 0;  /* CI의 각진 ㄷ을 따라 모서리 0 */
}

/* ===== 래퍼 기본 ===== */
.dc-content {
  position: relative;       /* 시트, 토스트는 position:fixed 대신 이 안에서 absolute */
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text-strong);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.dc-content [data-theme] { background: var(--bg); color: var(--text-strong); }
.dc-content,
.dc-content *,
.dc-content *::before,
.dc-content *::after { box-sizing: border-box; }
.dc-content .dc-h1, .dc-content .dc-h2, .dc-content .dc-h3 {
  font-family: var(--font-display); line-height: var(--lh-title); letter-spacing: var(--ls-title); margin: 0;
}
.dc-content :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.dc-content .num { font-variant-numeric: tabular-nums; }
.dc-content .dc-sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 누르면 살짝 줄어듦 */
.dc-content .pressable { transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }
.dc-content .pressable:active { transform: scale(0.97); }

/* 움직임 줄이기: !important 대신 시간 변수를 0으로 */
@media (prefers-reduced-motion: reduce) {
  .dc-content { --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
  .dc-content .pressable:active { transform: none; }
}

/* ===== 태블릿 (references/tablet.md) ===== */
@media (pointer: coarse) {
  .dc-content { --touch: var(--touch-class); --btn-h-s: var(--touch-class); }
}
@media (min-width: 744px) {
  .dc-content { --page-x: 1.5rem; --fs-body-lg: 1.125rem; }
}
@media (min-width: 1024px) and (orientation: landscape) {
  .dc-content { --page-x: 2rem; }
}


.dc-content .dc-logo { display: block; width: 100%; max-width: 15rem; height: auto; overflow: visible; }
.dc-content .dc-logo .dc-logo-d,
.dc-content .dc-logo .dc-logo-word { fill: var(--logo-ink); }
.dc-content .dc-logo .dc-logo-o { fill: var(--donga-red); }

/* 붙은 자리: ㄷ의 열린 오른쪽과 ㅇ의 곧은 왼쪽이 맞닿아 가운데에서 D 하나가 된다 */
.dc-content .dc-logo.is-open .dc-logo-d { animation: dc-logo-d 1.5s cubic-bezier(0.2, 0, 0, 1) both; }
.dc-content .dc-logo.is-open .dc-logo-o { animation: dc-logo-o 1.5s cubic-bezier(0.2, 0, 0, 1) both; }
.dc-content .dc-logo.is-open .dc-logo-word { animation: dc-logo-word 1.5s cubic-bezier(0.2, 0, 0, 1) both; }

@keyframes dc-logo-d {
  0%   { transform: translate(183.5px, -41.25px); opacity: 0; }
  15%  { transform: translate(183.5px, -41.25px); opacity: 1; }
  35%  { transform: translate(183.5px, -41.25px); }
  80%, 100% { transform: translate(0, 0); opacity: 1; }
}
@keyframes dc-logo-o {
  0%   { transform: translate(-183.5px, 41.25px); opacity: 0; }
  15%  { transform: translate(-183.5px, 41.25px); opacity: 1; }
  35%  { transform: translate(-183.5px, 41.25px); }
  80%, 100% { transform: translate(0, 0); opacity: 1; }
}
@keyframes dc-logo-word {
  /* 글자는 ㄷ의 오른쪽 끝과 ㅇ의 왼쪽 끝 사이만 보인다: 둘과 같은 시간, 같은 곡선으로 틈을 따라 열려 하얀 빈칸이 생기지 않는다.
     아래쪽도 내려가는 ㄷ의 밑변을 따라가서 붙은 D 밖으로 글자가 삐져나오지 않는다 */
  0%, 35% { clip-path: inset(-10px 116.87px 30.65px 159.22px); }
  80%, 100% { clip-path: inset(-10px -66.63px -10.6px -24.28px); }
}
/* 움직임 줄이기: 벌어지는 움직임 없이 제자리에서 잠깐 나타나기만 한다 */
@keyframes dc-logo-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .dc-content .dc-logo.is-open .dc-logo-d,
  .dc-content .dc-logo.is-open .dc-logo-o,
  .dc-content .dc-logo.is-open .dc-logo-word { animation: dc-logo-fade 0.4s linear both; }
}


/* ===== 이 화면 ===== */
.dc-content .qz { max-width: 40rem; margin: 0 auto; padding: var(--sp-6) var(--page-x) var(--sp-16); }
.dc-content .qz-top { display: flex; align-items: center; justify-content: flex-end; margin-bottom: var(--sp-6); }
.dc-content .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border-radius: var(--r-control); }
.dc-content .seg-btn {
  min-height: var(--touch); min-width: var(--touch); padding: 0 var(--sp-3); border: 0; border-radius: calc(var(--r-control) - 3px);
  background: transparent; color: var(--text-muted); font: inherit; font-size: var(--fs-small); font-weight: var(--fw-medium); cursor: pointer;
}
.dc-content .seg-btn[aria-pressed="true"] { background: var(--fill-subtle); color: var(--text-strong); font-weight: var(--fw-semibold); }

.dc-content .intro { background: var(--surface); border-radius: var(--r-card); padding: var(--sp-10) var(--sp-6) var(--sp-8); text-align: center; }
.dc-content .intro .dc-logo { margin: 0 auto var(--sp-8); max-width: 13rem; }
.dc-content .intro-title { font-size: var(--fs-title); font-weight: var(--fw-bold); }
.dc-content .intro-sub { margin: var(--sp-2) 0 var(--sp-8); color: var(--text-muted); }

.dc-content .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--btn-h); padding: 0 var(--sp-6); border: 0; border-radius: var(--r-control);
  font: inherit; font-weight: var(--fw-semibold); cursor: pointer;
}
.dc-content .btn-primary { background: var(--accent); color: var(--on-accent); }
.dc-content .btn-primary:hover { background: var(--accent-press); }
.dc-content .btn-primary:disabled { background: var(--surface); color: var(--text-disabled); cursor: default; }
.dc-content .btn-ghost { background: var(--fill-subtle); color: var(--text-strong); }
.dc-content .btn-block { width: 100%; }

.dc-content .progress { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); color: var(--text-muted); font-size: var(--fs-small); }
.dc-content .bar { flex: 1; height: 6px; border-radius: var(--r-full); background: var(--line-strong); overflow: hidden; }
.dc-content .bar-fill { width: 0; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--dur) var(--ease); }

.dc-content .card { background: var(--surface); border-radius: var(--r-card); padding: var(--sp-6); }
.dc-content .q-title { font-size: var(--fs-title-s); font-weight: var(--fw-bold); margin-bottom: var(--sp-2); }
.dc-content .q-desc { color: var(--text-muted); margin: 0 0 var(--sp-5); }
.dc-content .chart { display: block; width: 100%; height: auto; overflow: visible; margin-bottom: var(--sp-2); }
.dc-content .chart .ax { stroke: var(--line-strong); }
.dc-content .chart .lbl { fill: var(--text-muted); font-size: 13px; }
.dc-content .chart .rain { fill: var(--second); opacity: 0.3; }
.dc-content .chart .temp { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.dc-content .table-alt { margin-bottom: var(--sp-4); color: var(--text-muted); font-size: var(--fs-small); }
.dc-content .table-alt summary { cursor: pointer; min-height: var(--touch); display: flex; align-items: center; }
.dc-content .table-alt table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.dc-content .table-alt th, .dc-content .table-alt td { padding: var(--sp-1) var(--sp-2); text-align: right; }

.dc-content .opts { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.dc-content .opt {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: var(--row-h); padding: 0 var(--sp-4);
  border: 1.5px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface);
  color: var(--text-strong); font: inherit; text-align: left; cursor: pointer;
}
.dc-content .opt .mark { flex: none; width: 1.25rem; height: 1.25rem; border-radius: var(--r-full); border: 1.5px solid var(--icon-muted); display: grid; place-items: center; }
.dc-content .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-weak); }
.dc-content .opt[aria-checked="true"] .mark { border-color: var(--accent); background: var(--accent); }
.dc-content .opt .mark svg { width: 0.75rem; height: 0.75rem; stroke: var(--on-accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.dc-content .opt[aria-checked="true"] .mark svg { opacity: 1; }
.dc-content .opt:disabled { cursor: default; }
.dc-content .opt.is-answer { border-color: var(--positive); }

.dc-content .fb { display: flex; gap: var(--sp-3); padding: var(--sp-4); border-radius: var(--r-control); }
.dc-content .fb svg { flex: none; width: 1.25rem; height: 1.25rem; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dc-content .fb-ok { background: var(--positive-weak); color: var(--positive); }
.dc-content .fb-no { background: var(--critical-weak); color: var(--critical); }
.dc-content .fb p { margin: 0; color: var(--text-strong); }
.dc-content .fb strong { display: block; color: inherit; }

.dc-content .actions { position: sticky; bottom: 0; z-index: var(--z-sticky); padding: var(--sp-3) 0 var(--sp-4); background: var(--bg); }
.dc-content .done { text-align: center; }
.dc-content .done-sub { margin: 0; color: var(--text-muted); }
.dc-content .done .big { font-size: var(--fs-title); font-weight: var(--fw-bold); margin: var(--sp-2) 0 var(--sp-6); }

.dc-content .quiz-grid { display: grid; gap: var(--sp-3); }
.dc-content .quiz-grid .opts { margin-bottom: 0; }
.dc-content .quiz-grid #fb:not(:empty) { margin-top: var(--sp-4); }
.dc-content .table-alt { margin-bottom: 0; }

/* 태블릿 세로: 넓은 한 칸, 선택지 2열 */
@media (min-width: 744px) {
  .dc-content .qz { max-width: 44rem; padding-top: var(--sp-8); }
  .dc-content .opts { grid-template-columns: 1fr 1fr; }
  .dc-content .intro, .dc-content .done { max-width: 32rem; margin-left: auto; margin-right: auto; }
}
/* 태블릿 가로: 그림 왼쪽(고정), 문제 오른쪽 */
@media (min-width: 1024px) and (orientation: landscape) {
  .dc-content .qz { max-width: 72rem; }
  .dc-content .quiz-grid { grid-template-columns: minmax(0, 3fr) minmax(20rem, 2fr); gap: var(--sp-6); align-items: start; }
  .dc-content .quiz-grid .progress { grid-column: 1 / -1; margin-bottom: 0; }
  .dc-content .stage { position: sticky; top: var(--sp-6); }
  .dc-content .stage .chart { max-height: calc(100dvh - 18rem); }
  .dc-content .opts { grid-template-columns: 1fr; }
}
.dc-content .actions { padding-bottom: calc(var(--sp-4) + env(safe-area-inset-bottom)); }
.dc-content [hidden] { display: none; }
</style>
</head>

</svg>
      <h1 class="dc-h1 intro-title" id="intro-title">기후 그래프 읽기</h1>
      <p class="intro-sub">기온과 강수량 그래프를 보고 어느 기후인지 골라 보세요. 3문제예요.</p>
      <button type="button" class="btn btn-primary btn-block" id="start">문제 풀기 시작</button>
    </section>

    <section id="quiz" class="quiz-grid" hidden>
      <div class="progress"><span class="num" id="step">1 / 3</span><div class="bar" aria-hidden="true"><div class="bar-fill" id="bar"></div></div></div>
      <div class="card stage">
        <h2 class="dc-h2 q-title" id="q-title"></h2>
        <p class="q-desc">막대는 강수량, 선은 기온이에요. 아래 숫자는 월이에요.</p>
        <svg class="chart" id="chart" viewBox="0 0 320 152" role="img" aria-labelledby="chart-desc"><desc id="chart-desc"></desc></svg>
        <details class="table-alt"><summary>같은 자료를 표로 보기</summary><table id="tbl"></table></details>
      </div>
      <div class="panel">
        <div class="card">
          <div class="opts" role="radiogroup" aria-labelledby="q-title" id="opts"></div>
          <div id="fb" aria-live="polite"></div>
        </div>
        <div class="actions"><button type="button" class="btn btn-primary btn-block" id="check" disabled>정답 확인하기</button></div>
      </div>
    </section>

    <section class="card done" id="done" hidden>
      <p class="done-sub">다 풀었어요</p>
      <p class="big num" id="score"></p>
      <button type="button" class="btn btn-ghost btn-block" id="again">처음부터 다시 풀기</button>
    </section>
  </main>
</div>
<script>
(function () {
  var root = document.getElementById('app');
  function $(id) { return root.querySelector('#' + id); }
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  function icon(d) {
    var s = svgEl('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    s.appendChild(svgEl('path', { d: d }));
    return s;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  /* 화면 밝기: 저장하지 않고 지금 화면에서만 바꾼다 */
  root.querySelectorAll('.seg-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.getAttribute('data-mode');
      if (m === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', m);
      root.querySelectorAll('.seg-btn').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    });
  });

  var QUESTIONS = [
    { place: '가', temp: [26,26,27,27,27,27,27,27,27,27,26,26], rain: [250,240,300,280,200,150,160,190,230,260,260,270], answer: 0, why: '1년 내내 기온이 25도를 넘고 비가 많아요.' },
    { place: '나', temp: [-18,-15,-6,4,12,18,21,19,12,3,-7,-15], rain: [8,8,12,25,45,75,90,80,50,25,15,10], answer: 3, why: '겨울이 길고 영하 15도 아래로 춥고, 여름에 비가 몰려요.' },
    { place: '다', temp: [11,12,14,17,21,25,28,28,25,20,15,12], rain: [70,60,55,35,15,3,1,2,10,40,65,75], answer: 2, why: '여름이 덥고 건조하며 비는 겨울에 내려요.' }
  ];
  var CHOICES = ['열대 우림 기후', '사막 기후', '지중해성 기후', '냉대 기후'];
  var idx = 0, picked = -1, checked = false, score = 0;

  /* 그래프는 실제 표시 폭으로 viewBox를 잡아 글자 크기가 화면 폭에 따라 커지지 않게 한다 */
  function drawChart(q) {
    var svg = $('chart');
    while (svg.lastChild && svg.lastChild.nodeName !== 'desc') svg.removeChild(svg.lastChild);
    var W = Math.max(280, Math.round(svg.getBoundingClientRect().width) || 320);
    var H = Math.round(Math.min(300, Math.max(160, W * 0.42)));
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var x0 = 4, w = W - 8, top = 6, h = H - 34, bw = w / 12;
    svg.appendChild(svgEl('line', { class: 'ax', x1: x0, y1: top + h, x2: x0 + w, y2: top + h }));
    q.rain.forEach(function (r, i) {
      var bh = r / 320 * h;
      svg.appendChild(svgEl('rect', { class: 'rain', x: x0 + i * bw + bw * 0.15, y: top + h - bh, width: bw * 0.7, height: bh, rx: 2 }));
      var t = svgEl('text', { class: 'lbl', x: x0 + i * bw + bw / 2, y: top + h + 20, 'text-anchor': 'middle' });
      t.textContent = bw < 36 ? String(i + 1) : (i + 1) + '월';  /* 좁으면 숫자만 */
      svg.appendChild(t);
    });
    var pts = q.temp.map(function (t, i) { return (x0 + i * bw + bw / 2) + ',' + (top + h - (t + 25) / 60 * h); }).join(' ');
    svg.appendChild(svgEl('polyline', { class: 'temp', points: pts }));
    $('chart-desc').textContent = q.place + ' 지역의 월별 기온과 강수량';
    var tbl = $('tbl'); clear(tbl);
    var head = el('tr');
    ['월', '기온(도)', '강수량(mm)'].forEach(function (s) { head.appendChild(el('th', { scope: 'col' }, s)); });
    tbl.appendChild(head);
    q.temp.forEach(function (t, i) {
      var tr = el('tr');
      [(i + 1) + '월', String(t), String(q.rain[i])].forEach(function (s) { tr.appendChild(el('td', null, s)); });
      tbl.appendChild(tr);
    });
  }

  function select(i) {
    if (checked) return;
    picked = i;
    root.querySelectorAll('.opt').forEach(function (o, k) {
      o.setAttribute('aria-checked', String(k === i));
      o.tabIndex = k === i ? 0 : -1;
    });
    $('check').disabled = false;
  }

  function render() {
    var q = QUESTIONS[idx];
    picked = -1; checked = false;
    $('step').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
    $('bar').style.width = (idx / QUESTIONS.length * 100) + '%';
    $('q-title').textContent = (idx + 1) + '. (' + q.place + ') 지역은 어느 기후일까요?';
    drawChart(q);
    var opts = $('opts'); clear(opts);
    CHOICES.forEach(function (c, i) {
      var b = el('button', { type: 'button', class: 'opt', role: 'radio', 'aria-checked': 'false', tabindex: i === 0 ? '0' : '-1' });
      var mark = el('span', { class: 'mark', 'aria-hidden': 'true' });
      mark.appendChild(icon('M5 12l5 5 9-10'));
      b.appendChild(mark);
      b.appendChild(el('span', null, c));
      b.addEventListener('click', function () { select(i); });
      b.addEventListener('keydown', function (e) {
        var n = null;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (i + 1) % CHOICES.length;
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (i + CHOICES.length - 1) % CHOICES.length;
        if (n !== null) { e.preventDefault(); select(n); opts.children[n].focus(); }
      });
      opts.appendChild(b);
    });
    clear($('fb'));
    $('check').textContent = '정답 확인하기';
    $('check').disabled = true;
  }

  function check() {
    var q = QUESTIONS[idx];
    if (!checked) {
      if (picked < 0) return;
      checked = true;
      var ok = picked === q.answer;
      if (ok) score++;
      root.querySelectorAll('.opt').forEach(function (o, k) { o.disabled = true; if (k === q.answer) o.classList.add('is-answer'); });
      var box = el('div', { class: 'fb ' + (ok ? 'fb-ok' : 'fb-no') });
      box.appendChild(icon(ok ? 'M5 12l5 5 9-10' : 'M12 8v5M12 16.5v.5M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z'));
      var p = el('p');
      p.appendChild(el('strong', null, ok ? '맞았어요. ' + CHOICES[q.answer] + '예요' : '정답은 ' + CHOICES[q.answer] + '예요'));
      p.appendChild(document.createTextNode(q.why));
      box.appendChild(p);
      $('fb').appendChild(box);
      $('check').textContent = idx < QUESTIONS.length - 1 ? '다음 문제 보기' : '결과 보기';
      $('check').focus();
    } else if (idx < QUESTIONS.length - 1) {
      idx++; render(); $('q-title').focus();
    } else {
      $('quiz').hidden = true; $('done').hidden = false;
      $('score').textContent = QUESTIONS.length + '문제 중 ' + score + '문제 맞았어요';
      $('again').focus();
    }
  }

  function start() { $('intro').hidden = true; $('done').hidden = true; $('quiz').hidden = false; idx = 0; score = 0; render(); $('q-title').focus(); }
  $('q-title').tabIndex = -1;
  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('check').addEventListener('click', check);
  /* 화면 방향이나 폭이 바뀌면 그래프만 다시 그린다. 고른 답과 푼 상태는 그대로 */
  if (window.ResizeObserver) {
    var lastW = 0;
    new ResizeObserver(function (en) {
      var cw = Math.round(en[0].contentRect.width);
      if (cw && cw !== lastW && !$('quiz').hidden) { lastW = cw; drawChart(QUESTIONS[idx]); }
    }).observe($('chart'));
  }
})();
</script>
</body>
